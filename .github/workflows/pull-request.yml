name: Pull Request

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    # Keep proposed source validation separate from publishing privileges.
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Check out proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run source checks
        uses: ./.github/actions/check-dotnet-bepinex-source
  test:
    name: Test
    # Smoke-test both Windows-targeted outputs on the oldest supported image.
    runs-on: windows-2022

    steps:
      - name: Check out proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run source tests
        uses: ./.github/actions/test-dotnet-bepinex-source
